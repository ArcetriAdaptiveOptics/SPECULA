# Each job of the CI matrix (.github/workflows/specula.yml) uploads its own
# coverage report. The 15 MPI jobs run only "pytest -k mpi" and finish first:
# without this setting Codecov comments/notifies after the first upload, with
# a partial report. Waiting for 16 uploads (number of MPI jobs + 1) ensures
# that at least one full test-suite run is included.
codecov:
  notify:
    after_n_builds: 16

comment:
  after_n_builds: 16
