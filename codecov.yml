# Each job of the CI matrix (.github/workflows/specula.yml) uploads its own
# coverage report. 12 of the 21 jobs run only the MPI tests ("pytest -k mpi").
# Waiting for 13 uploads (number of MPI jobs + 1) ensures that at least one
# full test-suite run is included in the first notification; later uploads
# update it.
codecov:
  notify:
    after_n_builds: 13

comment:
  after_n_builds: 13
