
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          './calibration'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       120 #160              # Must match influence function computation
  pixel_pitch:       0.06833 #0.0513       # [m] 8.2m / 160 pixels = 0.0513 m/pixel
  total_time:        1.000                 # [s] 1 second simulation
  time_step:         0.0005                # [s] 0.5ms time steps (2 kHz)
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          0.9                  # [arcsec]
  outputs:           ['output']

wind_speed:
  class:             'WaveGenerator'
  constant:          [15.0, 13.0, 13.0, 9.0, 9.0, 15.0, 25.0, 40.0, 21.0]    # [m/s] Multi-layer wind speeds
  outputs:           ['output']

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 57.0, 48.0, -102.0, -83.0, -77.0] # [deg] Wind directions for each layer
  outputs:           ['output']

# # Science target (on-axis)
# source_science:
#   class:             'Source'
#   polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis target
#   height:            .inf                  # Infinite height (star)
#   magnitude:         10.0                  # H-band magnitude
#   wavelengthInNm:    500                  # [nm]

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         8.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    850                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  simul_params_ref:  'main'
  mask_diam:         1.0                   # Full pupil diameter
  obs_diam:          0.14                  # 14% central obstruction (VLT-like)

aperture:
  class:             'Pupilstop'
  simul_params_ref:  'main'
  mask_diam:         1.0                   # Full pupil diameter

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [42.0, 140.0, 281.0, 562.0, 1125.0, 2250.0, 4500.0, 900.0, 18000.0] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [0.5328,0.0145,0.035,0.0957,0.1083,0.0437,0.0658,0.0371,0.0671]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] #['source_science', 'source_ngs']
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef'] #['out_source_science_ef', 'out_source_ngs_ef']

ef_prop1:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm1.out_layer:-1'          # DM1 correction
  outputs: ['out_ef']

ef_prop2:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'ef_prop1.out_ef'    # DM1 correction
    in_ef2: 'dm2.out_layer:-1'   # DM2 correction
  outputs: ['out_ef']

unab_prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] #['source_science', 'source_ngs']
  inputs:
    common_layer_list: ['aperture']       # Unobstructed upil
  outputs:           ['out_source_ngs_ef']

########################################################
############### FIRST STAGE ############################
# sh:
#   class:             'SH'
#   subap_on_diameter: 40                    # 40x40 subapertures across pupil
#   subap_wanted_fov:  2.4                   # [arcsec] Subaperture field of view
#   sensor_pxscale:    0.4                   # [arcsec/pixel] Pixel scale
#   subap_npx:         6                     # 8x8 pixels per subaperture
#   wavelengthInNm:    800                   # [nm] R-band sensing
#   inputs:
#     in_ef:           'prop.out_source_ngs_ef'
#   outputs:           ['out_i']

pyr1:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          60.                     # Pupil diameter in subaps.
  pup_dist:          72.                     # Separation between pupil centers in subaps.
  fov:               2.0                     # Requested field-of-view [arcsec]
  mod_amp:           3.0                     # Modulation radius (in lambda/D units)
  output_resolution: 240                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    850                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_prop1.out_ef' #'prop.out_source_ngs_ef'

ocam1:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [240, 240]            # Total detector size
  dt:                0.001                 # [s] Integration time (1ms)
  bandw:             100                   # [nm] R+I-band filter width 600-900nm
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.3                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'pyr1.out_i' #'sh.out_i'
  outputs:           ['out_pixels']

slopes1:
  class:             'PyrSlopec'
  pupdata_object:    'pyr1_pupdata'            # tag of the pyramid WFS pupils
  # sn_object:         'pyr1_slope_null'
  inputs:
    in_pixels:        'ocam1.out_pixels'
  outputs:           ['out_slopes']

modalrec1:
  class:             'Modalrec'
  recmat_object:     'dm1_1100modes_rec'        # Reconstruction matrix tag
  inputs:
    in_slopes:       'slopes1.out_slopes'
  outputs:           ['out_modes']

filter1:
  class:             'Integrator'
  simul_params_ref:  'main'
  delay:             1                     # 1 frame delay (realistic)
  int_gain:          [0.9,0.8,0.6,0.0]
  n_modes:           [2,10,788,300]                 # Number of modes to control
  inputs:
    delta_comm:      'modalrec1.out_modes'
  outputs:           ['out_comm']

# filter1:
#   class:                'IirFilter'
#   simul_params_ref:     'main'
#   delay:                1 # Total temporal delay in time steps is this value +1
#   iir_filter_data_object:  'dm1_iirfilter'
#   inputs:
#     delta_comm: 'modalrec1.out_modes'
#   outputs:  ['out_comm']

dm1:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm1_ifunc'      # Our computed influence functions
  m2c_object:        'dm1_m2c'        # Modal-to-command matrix
  nmodes:            1100             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'filter1.out_comm' #'integrator.out_comm'
  outputs:           ['out_layer']


#########################################################
############### SECOND STAGE ############################
pyr2:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          30.                     # Pupil diameter in subaps.
  pup_dist:          36.                     # Separation between pupil centers in subaps.
  fov:               2.0                     # Requested field-of-view [arcsec]
  mod_amp:           0.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                     # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    850                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_prop2.out_ef'

ocam2:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120, 120]            # Total detector size
  dt:                0.0005               # [s] Integration time (0.5ms)
  bandw:             100                   # [nm] R+I-band filter width 600-900nm
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.3                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'pyr2.out_i'
  outputs:           ['out_pixels']

slopes2:
  class:             'PyrSlopec'
  pupdata_object:    'pyr2_pupdata'            # tag of the pyramid WFS pupils
  # sn_object:         'pyr2_slope_null' # 'pyr2_pc_slope_null' #
  # slopes_from_intensity: true
  inputs:
    in_pixels:        'ocam2.out_pixels'
  outputs:           ['out_slopes']

modalrec2:
  class:             'Modalrec'
  recmat_object:     'dm2_100modes_rec'        # Reconstruction matrix tag
  inputs:
    in_slopes:       'slopes2.out_slopes'
  outputs:           ['out_modes']

filter2:
  class:             'Integrator'
  simul_params_ref:  'main'
  delay:             1                     # 1 frame delay (realistic)
  int_gain:          [0.4]
  n_modes:           [100]           # Number of modes to control
  inputs:
    delta_comm:      'modalrec2.out_modes'
  outputs:           ['out_comm']

# filter2:
#   class:                'IirFilter'
#   simul_params_ref:     'main'
#   delay:                0 # Total temporal delay in time steps is this value +1
#   iir_filter_data_object: 'dm2_iirfilter' # 'dm_100modes_g09_iirfilter' #
#   inputs:
#     delta_comm: 'modalrec2.out_modes'
#   outputs:  ['out_comm']

dm2:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm2_ifunc'      # Our computed influence functions
  m2c_object:        'dm2_m2c'        # Modal-to-command matrix
  nmodes:            100                   # Number of controlled modes
  height:            0                     # Ground-conjugated DM
  inputs:
    in_command:      'filter2.out_comm'
  outputs:           ['out_layer']


###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    730                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  inputs:
    in_ef:           'unab_prop.out_source_ngs_ef'
  outputs:           ['out_psf', 'out_sr']


psf1:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    730                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  inputs:
    in_ef:           'ef_prop1.out_ef'
  outputs:           ['out_psf', 'out_sr']

coro_psf1:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    730                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  inputs:
    in_ef:           'ef_prop1.out_ef' #'prop.out_source_ngs_ef'
  outputs:           ['out_std_coronagraph_psf']

psf2:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    730                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  inputs:
    in_ef:           'ef_prop2.out_ef'
  outputs:           ['out_psf', 'out_sr']

coro_psf2:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    730                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  inputs:
    in_ef:           'ef_prop2.out_ef'
  outputs:           ['out_std_coronagraph_psf']

# Modal residual
dm2_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm2_kl_inv'
  inputs:
    in_ef: ['ef_prop2.out_ef']
  outputs: ['out_modes']

dm1_mode_res2:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm2_kl_inv'
  inputs:
    in_ef: ['ef_prop1.out_ef']
  outputs: ['out_modes']

dm1_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm1_kl_inv'
  inputs:
    in_ef: ['ef_prop1.out_ef']
  outputs: ['out_modes']

atmo_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm1_kl_inv'
  inputs:
    in_ef: 'prop.out_source_ngs_ef'
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         './output'            # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: ['dm1_cmd-filter1.out_comm',
                 'dm2_cmd-filter2.out_comm',
                  'ref_psf-psf.out_psf',
                  'sr1-psf1.out_sr',
                  'psf1-psf1.out_psf',
                  'sr2-psf2.out_sr',
                  'psf2-psf2.out_psf',
                  'coro_psf1-coro_psf1.out_std_coronagraph_psf',
                  'coro_psf2-coro_psf2.out_std_coronagraph_psf',
                  'atmo_kl1_res-atmo_mode_res.out_modes',
                  'dm1_kl1_res-dm1_mode_res.out_modes',
                  'dm1_kl2_res-dm1_mode_res2.out_modes',
                  'dm2_kl2_res-dm2_mode_res.out_modes',
                  'pyr1_res-modalrec1.out_modes',
                  'pyr2_res-modalrec2.out_modes',
                  'ccd1-ocam1.out_pixels',
                  'ccd2-ocam2.out_pixels',]

