# Interaction Matrix and Reconstructor Calibration
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       815                         # Number of DM actuators
  amp:          25    
  constant_amp: false
  # vect_amplitude_data: 'pushpull_815modes_amp20'  # Amplitude vector
  outputs:   ['output']

# Interaction matrix calibrator
im_calibrator:
  class:     'ImCalibrator'
  nmodes:    815                        # Number of modes to calibrate
  im_tag:    'dm2_815modes_im'                # Output IM filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_slopes:   'slopes2.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

# Reconstructor calibrator
rec_calibrator:
  class:     'RecCalibrator'
  nmodes:    100                          # Number of modes (reduced to keep noise propagation low and avoid numerical issues)
  rec_tag:   'dm2_100modes_rec'           # Output REC filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_intmat:   'im_calibrator.out_intmat'  # Connect to IM output

# Override main simulation parameters
main_override:
  total_time: 0.815              # 815 modes × 2 (push+pull) × 0.0005s

# Disable atmosphere for clean calibration
prop_override:
  source_dict_ref:   ['source_ngs']
  inputs:
    common_layer_list: ['pupilstop', 'dm2.out_layer']  # Only pupil + DM
  outputs:           ['out_source_ngs_ef']

# Override DM to use calibration commands
dm2_override:
  sign: 1                                # Use positive sign for calibration (default is -1)
  nmodes: 815                            # Use all modes for calibration
  inputs:
    in_command: 'pushpull.output'         # Connect to push-pull generator

pyr2_override:
  inputs: 
    in_ef: 'prop.out_source_ngs_ef'

# Disable noise for clean measurements
ocam2_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction','data_store','atmo_mode_res', #'source_science',
        'dm2_mode_res','filter2','psf2','coro_psf2','ef_prop2','modalrec2',
        'slopes1','dm1_mode_res','modalrec1','filter1','dm1','psf1','coro_psf1','pyr1','ocam1','ef_prop1']
