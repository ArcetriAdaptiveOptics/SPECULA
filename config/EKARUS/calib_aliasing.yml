# Aliasing Calibration
# ================================================
# Override main simulation parameters
main_override:
  total_time: 20.0                # 20'000 frames x 0.001 s

################################## ATMO RESIDUAL #####################################

# DM applying partial correction
perfect_dm:
  class: 'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm468_ifunc'      # Our computed influence functions
  m2c_object:        'dm468_m2c'        # Modal-to-command matrix
  nmodes:            443              # Number of controlled modes
  height:            0.0              # Ground-conjugated DM
  inputs:
    in_command: 'atmo_modes.out_modes'
  outputs: ['out_layer']

ef_prop_override:
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'   # Turbulence
    in_ef2: 'perfect_dm.out_layer'              # Partial correction
  outputs: ['out_ef']

######################################################################################

pyr_override:
  inputs: 
    in_ef: 'ef_prop.out_ef'

# Disable noise for clean measurements
ocam_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise
  
# pyr_pc_modalrec:
#   class:             'Modalrec'
#   recmat_object:     'pyr3.0_40x40_s1.0_400modes_rec'        
#   inputs:
#     in_slopes:       'pyr_slopes.out_slopes'
#   outputs:           ['out_modes']

# Data store for results
data_store_override:
  store_dir:         '/raid1/mmenessini/calibration/EKARUS/scratch_aliasing' 
  create_tn: false
  inputs:
    input_list: ['pyr_modes-pyr_modalrec.out_modes'] #,'pyr_pc_modes-pyr_pc_modalrec.out_modes',]


# Remove unnecessary objects during calibration
remove: ['dm_mode_res','filter','psf','dm'] 
