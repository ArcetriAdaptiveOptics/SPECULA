pushpull:
  class:     'PushPullGenerator'
  nmodes:     2000
  vect_amplitude_data:  'pushpull_4519modes_amp50'
  outputs: ['output']

main_override:
  total_time:  8.0000

prop_override:
  inputs:
    common_layer_list: ['pupilstop',
                  'dm.out_layer']

dm_override:
  sign: 1
  inputs:
      in_command: 'pushpull.output'

detector1_override:
  photon_noise:      False
  readout_noise:     False

im_calibrator:
  class: 'ImCalibrator'
  nmodes: 2000
  im_tag:     'test_morfeo_scao_im_2000modes'
  overwrite: True
  inputs:
    in_slopes: 'slopec1.out_slopes'
    in_commands: 'pushpull.output'
  outputs: ['out_intmat']

rec_calibrator:
  class: 'RecCalibrator'
  nmodes: 2000
  rec_tag:     'test_morfeo_scao_rec_2000modes'
  pupdata_tag: 'morfeo_np_ps480p0.080_shs68x68_wl589_fv16.1_np14_th0.25'
  overwrite: True
  inputs:
    in_intmat: 'im_calibrator.out_intmat'

remove: ['atmo', 'rec', 'control']
