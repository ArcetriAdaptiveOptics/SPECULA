# override for display settings (MORFEO LTAO)

main_override:
  display_server:    false

sc1_disp:
  class:            'SlopecDisplay'
  inputs:
    slopes:       'slopec1.out_slopes'

sr_disp:
  class:            'PlotDisplay'
  inputs:
    value:       'psf.out_sr'
  title:            'SR'

ph_disp:
  class:            'PhaseDisplay'
  inputs:
    phase:       'prop.out_on_axis_source_ef'
  title:            'PHASE ON AXIS'

dm_disp:
  class:            'PhaseDisplay'
  inputs:
    phase:       'dm.out_layer'
  title:            'DM'

psf_disp:
  class:            'PsfDisplay'
  inputs:
    psf:       'psf.out_psf'
  title:            'PSF'
  figsize:       [9, 8]  # size in inches

cmd_disp:
  class:            'ModesDisplay'
  inputs:
    modes:       'rec.out_modes'
  title:            'rec.out_modes'

pixels_disp:
  class:            'PixelsDisplay'
  inputs:
    pixels:      'detector1.out_pixels'
  title:            'Pixels'
