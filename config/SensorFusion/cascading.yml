############################ Control ################################

filter2:
  class:             'Integrator'
  simul_params_ref:  'main'
  delay:             1                     # 1 frame delay (realistic)
  int_gain:          [0.5]
  n_modes:           [150]                 # Number of modes to control
  inputs:
    delta_comm:      'pyr0_modalrec.out_modes' #
  outputs:           ['out_comm']


dm2:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm241_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'dm241_vlt_m2c'        # Modal-to-command matrix
  nmodes:            150             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'filter2.out_comm'
  outputs:           ['out_layer']

filter1:
  class:             'Integrator'
  simul_params_ref:  'main'
  delay:             1                     # 1 frame delay (realistic)
  int_gain:          [0.7]
  n_modes:           [1300]                 # Number of modes to control
  inputs:
    delta_comm:      'pyr_modalrec.out_modes' #
  outputs:           ['out_comm']
  # class:                'IirFilter'
  # simul_params_ref:     'main'
  # iir_gain:             0.5
  # delay:                1 # Total temporal delay in time steps is this value +1
  # iir_filter_data_object:  'iirfilter'
  # inputs:
  #   delta_comm: 'pyr0_modalrec.out_modes' #'ogc_modes.out_value' 
  # outputs:  ['out_comm']

dm1:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'        # Modal-to-command matrix
  nmodes:            1300             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'filter1.out_comm'
  outputs:           ['out_layer']


###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  verbose: false
  inputs:
    in_ef:           'first_stage_prop.out_ef'
  outputs:           ['out_psf', 'out_std_psf', 'out_sr']

coro_psf:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  verbose: false
  # use_average_field: false
  inputs:
    in_ef:           'first_stage_prop.out_ef' 
  outputs:           ['out_coronagraph_psf','out_std_coronagraph_psf']

dm2_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['first_stage_prop.out_ef']
  outputs: ['out_modes']

dm1_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['ef_prop.out_ef']
  outputs: ['out_modes']

atmo_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         './output'            # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: ['dm1_cmd-filter1.out_comm',
                  'dm2_cmd-filter2.out_comm',
                  'sr-psf.out_sr',
                  'psf-psf.out_psf',
                  'psf_std-psf.out_std_psf',
                  'coro_psf_std-coro_psf.out_coronagraph_psf',
                  'atmo_res-atmo_mode_res.out_modes',
                  'dm1_res-dm1_mode_res.out_modes',
                  'dm1_cmd-filter1.out_comm',
                  'dm2_res-dm2_mode_res.out_modes',
                  'dm2_cmd-filter2.out_comm',
                  'stage1_modes-pyr_modalrec.out_modes',
                  'stage2_modes-pyr0_modalrec.out_modes',
                  'ccd1-cred1.out_pixels',
                  'ccd2-cred2.out_pixels'
                  ]

