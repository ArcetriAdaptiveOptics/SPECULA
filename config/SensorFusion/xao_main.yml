########################### ZWFS ####################################
zwfs:
  class:              'ZernikeSensor' 
  simul_params_ref:   'main'
  pup_diam:           48.                     # Pupil diameter in subaps.
  fov:                2.0                     # Requested field-of-view [arcsec]
  spot_radius_lambda: 0.75                     # Spot radius in λ/D units
  fft_res:            4.0
  output_resolution:  120                     # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:     750                     # [nm] zWFS wavelength
  inputs:
    in_ef: 'ef_prop.out_ef' 

ocam2:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]             # Total detector size
  dt:                0.0005                # [s] Integration time (2000 fps)
  bandw:             400                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.5                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'zwfs.out_i' 
  outputs:           ['out_pixels']

zwfs_slopes:
  class:             'ZwfsSlopec'
  # sn_object:         'z1.5wfs_slope_null'
  pup_diam:          48.0
  ccd_size:          120
  obsratio:          0.0 #14
  inputs:
    in_pixels:        'ocam2.out_pixels'
  outputs:           ['out_slopes']

zwfs_modalrec:
  class:             'Modalrec'
  recmat_object:     'z1.5wfs_1300modes_rec'        
  inputs:
    in_slopes:       'zwfs_slopes.out_slopes'
  outputs:           ['out_modes']

