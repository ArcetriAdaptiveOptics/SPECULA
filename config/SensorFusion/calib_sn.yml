#   inputs:
#     input_list: [ 'z2.0wfs_frame-ocam2.out_pixels','pyr0.5_frame-cred1.out_pixels',]

# Remove closed-loop components (not needed for slope null)
remove: ['atmo','seeing','wind_speed','wind_direction','atmo_modes', #'bootstrap', 'concat_wfs_modes', #'source_science',
        'dm','dm_mode_res','filter','psf','ef_prop','pyr_modalrec', 'zwfs_modalrec','coro_psf', ]
