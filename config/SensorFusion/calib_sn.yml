pyr_sn:
  class: 'SnCalibrator'
  output_tag: 'pyr0.0_slope_null'           # Output filename
  overwrite: false
  inputs:
    in_slopes: 'pyr_slopes.out_slopes'

zwfs_sn:
  class: 'SnCalibrator'
  output_tag: 'z2.0wfs_slope_null'           # Output filename
  overwrite: false
  inputs:
    in_slopes: 'zwfs_slopes.out_slopes'

pyr_override:
  # mod_amp: 0.5
  # pup_diam: 16.0
  # pup_dist: 20.0
  inputs:
    in_ef: 'prop.out_source_ngs_ef'

# pyr_slopes_override:
#   pupdata_object: 'pyr_pupdata_16x16'

zwfs_override:
  spot_radius_lambda: 1.0         
  inputs:
    in_ef: 'prop.out_source_ngs_ef'

main_override:
  total_time: 0.0005

# Disable noise for clean measurements
cred1_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

ocam2_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

# data_store_override:
#   class:             'DataStore'
