#   iir_filter_data_object:  'iirfilter'
#   inputs:
#     delta_comm: 'pyr_modalrec.out_modes' 
#   outputs:  ['out_comm']


###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  verbose: false
  inputs:
    in_ef:           'ef_prop.out_ef'
  outputs:           ['out_psf', 'out_std_psf', 'out_sr']

coro_psf:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.5                  # Start PSF integration after 500ms
  verbose: false
  # use_average_field: false
  inputs:
    in_ef:           'ef_prop.out_ef' 
  outputs:           ['out_coronagraph_psf','out_std_coronagraph_psf']

dm_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_kl_inv'
  inputs:
    in_ef: ['ef_prop.out_ef']
  outputs: ['out_modes']

atmo_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         './output'            # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: ['dm_cmd-filter.out_comm',
                  'sr-psf.out_sr',
                  'psf-psf.out_psf',
                  'psf_std-psf.out_std_psf',
                  'coro_psf_std-coro_psf.out_coronagraph_psf',
                  'atmo_res-atmo_mode_res.out_modes',
                  'dm_res-dm_mode_res.out_modes',
                  'pyr_modes-pyr_modalrec.out_modes',
                  'zwfs_modes-zwfs_modalrec.out_modes',
                  'ccd1-cred1.out_pixels',
                  'ccd2-ocam2.out_pixels']

# remove: ['']
