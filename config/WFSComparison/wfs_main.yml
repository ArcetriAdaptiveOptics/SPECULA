
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          './calibration'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       160                   # Must match influence function computation
  pixel_pitch:       0.0513                # [m] 8.2m / 160 pixels = 0.0513 m/pixel (Nyquist sampling of 10cm r0)
  total_time:        1.000                 # [s] 1 second simulation
  time_step:         0.0005                # [s] 0.5ms time steps (2 kHz)
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          0.88                  # [arcsec]
  outputs:           ['output']

wind_speed:
  class:             'WaveGenerator'
  constant:          [15.0, 13.0, 13.0, 9.0, 9.0, 15.0, 25.0, 40.0, 21.0]    # [m/s] Multi-layer wind speeds
  outputs:           ['output']

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 57.0, 48.0, -102.0, -83.0, -77.0] # [deg] Wind directions for each layer
  outputs:           ['output']

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         6.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    1200                   # [nm] R-band for WFS

# Telescope pupil geometry
vlt_aperture:
  class:             'Pupilstop'
  simul_params_ref:  'main'
  mask_diam:         1.0                  # Full pupil diameter
  obs_diam:          0.0                  # no central obstruction


# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [42.0, 140.0, 281.0, 562.0, 1125.0, 2250.0, 4500.0, 900.0, 18000.0] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [0.5328,0.0145,0.035,0.0957,0.1083,0.0437,0.0658,0.0371,0.0671]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['vlt_aperture']       # Pupil
  outputs:           ['out_source_ngs_ef'] 

ef_prop:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm.out_layer:-1'          # DM1 correction
  outputs: ['out_ef']

########################### PWFS ##############################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          48.                     # Pupil diameter in subaps.
  pup_dist:          60.                     # Separation between pupil centers in subaps.
  fov:               2.0                     # Requested field-of-view [arcsec]
  mod_amp:           0.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    750                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_prop.out_ef' #'prop.out_source_ngs_ef'

cred1:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]            # Total detector size
  dt:                0.0005                # [s] Integration time (2000 fps)
  bandw:             300                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.5                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'pyr.out_i' 
  outputs:           ['out_pixels']

pyr_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'pyr_pupdata'           
  slopes_from_intensity:  true
  # sn_object:            'pyr0.0_slope_null'
  inputs:
    in_pixels:        'cred1.out_pixels'
  outputs:           ['out_slopes']

pyr_modalrec:
  class:             'Modalrec'
  recmat_object:     'pyr0.0_1200modes_rec'        
  inputs:
    in_slopes:       'pyr_slopes.out_slopes'
  outputs:           ['out_modes']


# ########################### ZWFS ####################################
zwfs:
  class:              'ZernikeSensor' 
  simul_params_ref:   'main'
  pup_diam:           48.                     # Pupil diameter in subaps.
  fov:                2.0                     # Requested field-of-view [arcsec]
  spot_radius_lambda: 0.5                     # Spot radius in λ/D units
  fft_res:            4.0
  output_resolution:  120                     # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:     750                     # [nm] zWFS wavelength
  inputs:
    in_ef: 'ef_prop.out_ef' 

ocam2:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]             # Total detector size
  dt:                0.0005                # [s] Integration time (2000 fps)
  bandw:             300                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.5                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'zwfs.out_i' 
  outputs:           ['out_pixels']

zwfs_slopes:
  class:             'ZwfsSlopec'
  # sn_object:         'z1.0wfs_slope_null'
  pup_diam:          48.0
  ccd_size:          120
  obsratio:          0.0
  inputs:
    in_pixels:        'ocam2.out_pixels'
  outputs:           ['out_slopes']

zwfs_modalrec:
  class:             'Modalrec'
  recmat_object:     'z1.0wfs_1200modes_rec'        
  inputs:
    in_slopes:       'zwfs_slopes.out_slopes'
  outputs:           ['out_modes']

############################# CONTROL #########################################

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_m2c'        # Modal-to-command matrix
  nmodes:            1200             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'filter.out_comm'
  outputs:           ['out_layer']

filter:
  class:             'Integrator'
  simul_params_ref:  'main'
  delay:             1                     # 1 frame delay (realistic)
  int_gain:          [0.8]
  n_modes:           [1200]                 # Number of modes to control
  inputs:
    delta_comm:      'pyr_modalrec.out_modes' #
  outputs:           ['out_comm']

# filter:
#   class:                'IirFilter'
#   simul_params_ref:     'main'
#   iir_gain:             0.4
