# override for display settings

main_override:
  display_server:    false

dm_disp:
  class:            'PhaseDisplay'
  inputs:
    phase:       "dm.out_layer"
  title:            'DM'

sc_lgs_disp:
  class:            'SlopecDisplay'
  inputs:
    slopes:       'slopec_lgs.out_slopes'

sc_lo_disp:
  class:            'SlopecDisplay'
  inputs:
    slopes:       'slopec_lo.out_slopes'

sr_disp:
  class:            'PlotDisplay'
  inputs:
    value:       'psf.out_sr'
  title:            'SR'

ph_disp:
  class:            'PhaseDisplay'
  inputs:
    phase:       "prop.out_source_ngs_ef"
  title:            'PUPIL PHASE'

psf_disp:
  class:            'PsfDisplay'
  log_scale: True
  inputs:
    psf:       "psf.out_psf"
  title:            'PSF'