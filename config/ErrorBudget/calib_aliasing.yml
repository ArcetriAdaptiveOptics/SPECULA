# Aliasing Calibration
# ================================================
# Override main simulation parameters
main_override:
  total_time: 5.880                 # 10'000 frames

################################## ATMO RESIDUAL #####################################
# seeing_override:
#   constant:          0.6                  # [arcsec]

# DM applying partial correction
perfect_dm:
  class: 'DM'
  simul_params_ref:  'main'
  ifunc_object:      'asm_ifunc'      # Our computed influence functions
  m2c_object:        'asm_m2c'        # Modal-to-command matrix
  nmodes:            500              # Number of controlled modes
  height:            0.0              # Ground-conjugated DM
  inputs:
    in_command: 'atmo_modes.out_modes'
  outputs: ['out_layer']

ef_prop_override:
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'   # Turbulence
    in_ef2: 'perfect_dm.out_layer'              # Partial correction
  outputs: ['out_ef']

######################################################################################

pyr_override:
  inputs: 
    in_ef: 'ef_prop.out_ef'

# Disable noise for clean measurements
ocam_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

pyr_rec_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'asm_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store_override:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/calibration/SOUL/scratch_aliasing'             # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  'atmo_res-atmo_modes.out_modes',
                  'pyr_modes-pyr_modalrec.out_modes',
                  ]


# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction', #'source_science',
        'dm_mode_res','filter','psf','dm', 'prop'] #, 'bootstrap', 'concat_wfs_modes'
