pyr_sn:
  class: 'SnCalibrator'
  output_tag: 'pyr3.0_slope_null'           # Output filename
  overwrite: false
  inputs:
    in_slopes: 'pyr_slopes.out_slopes'

pyr_override:
  # mod_amp: 0.5
  # pup_diam: 16.0
  # pup_dist: 20.0
  inputs:
    in_ef: 'prop.out_source_ngs_ef'

# pyr_slopes_override:
#   pupdata_object: 'pyr_pupdata_16x16'

main_override:
  total_time: 0.000588

# Disable noise for clean measurements
ocam_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

# Remove closed-loop components (not needed for slope null)
remove: ['atmo','seeing','wind_speed','wind_direction','atmo_mode_res', 'data_store',
        'dm','dm_mode_res','filter','psf','ef_prop','pyr_modalrec', ]